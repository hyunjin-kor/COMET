[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catprice"
version = "1.2.0"
description = "Real-time metal price based catalyst manufacturing cost estimation tool"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "yfinance>=0.2",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/hyunjin-kor/CatPrice#readme"
Repository = "https://github.com/hyunjin-kor/CatPrice"
Issues = "https://github.com/hyunjin-kor/CatPrice/issues"
Releases = "https://github.com/hyunjin-kor/CatPrice/releases"
LatestInstaller = "https://github.com/hyunjin-kor/CatPrice/releases/latest"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.3",
    "pre-commit>=3.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
