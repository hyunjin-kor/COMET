name: Bug report
description: Something is broken in the desktop app, the calculation engine, or the documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please skim [SECURITY.md](https://github.com/hyunjin-kor/CatPrice/blob/master/SECURITY.md) first — security issues have a separate private channel.

  - type: input
    id: version
    attributes:
      label: CatPrice version
      description: From the desktop app's About dialog or `package.json`.
      placeholder: "1.3.9"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did you see the bug?
      options:
        - Desktop app (packaged installer)
        - Desktop app (dev / npm run dev)
        - Backend / API only
        - Documentation
        - CI / GitHub Actions
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: The smallest input that triggers the bug. Copy/paste the calculation request body if relevant.
      placeholder: |
        1. Open the Calculator page.
        2. Enter ...
        3. Click Run.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "The estimate should …"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: "The app crashed / showed price = NaN / returned 500."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        - Desktop launcher log: `%APPDATA%\CatPrice\catprice-launcher.log`
        - Browser console (dev mode): F12 → Console tab
      render: shell
