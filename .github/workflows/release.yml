name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-release:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit root deps (fail on high+ severity)
        run: npm audit --audit-level=high

      - name: Audit frontend deps (fail on high+ severity)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint Python
        run: ruff check .

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build desktop app
        run: |
          npm run build:frontend
          npm run build:backend-sidecar
          npm run desktop:stop
          npx electron-builder build --win --publish never

      - name: Archive unpacked desktop build
        shell: powershell
        run: Compress-Archive -Path dist-electron\win-unpacked\* -DestinationPath dist-electron\CatPrice-win-unpacked.zip

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.result }}
          generate_release_notes: false
          # electron-builder writes the NSIS installer to disk with spaces
          # ("CatPrice Setup 1.3.4.exe"). GitHub later sanitizes the asset
          # name to "CatPrice.Setup.1.3.4.exe" on upload, but the disk-side
          # glob has to use spaces (or this broader prefix-only pattern).
          files: |
            dist-electron/CatPrice*.exe
            dist-electron/CatPrice-win-unpacked.zip
