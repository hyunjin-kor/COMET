name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-release:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit root deps (fail on high+ severity)
        run: npm audit --audit-level=high

      - name: Audit frontend deps (fail on high+ severity)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint Python
        run: ruff check .

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build desktop app
        run: |
          npm run build:frontend
          npm run build:backend-sidecar
          npm run desktop:stop
          npx electron-builder build --win --publish never

      - name: Archive unpacked desktop build
        shell: powershell
        run: Compress-Archive -Path dist-electron\win-unpacked\* -DestinationPath dist-electron\COMET-win-unpacked.zip

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v9
        with:
          script: |
            // Only user-facing commit types reach the release page; docs, chore,
            // style, test, ci and build land in the Full Changelog link instead.
            const SECTIONS = [
              { title: "New features", types: ["feat"] },
              { title: "Fixes", types: ["fix"] },
              { title: "Changes", types: ["perf", "refactor"] },
            ];
            const semver = (name) => name.replace(/^v/, "").split(".").map(Number);
            const { owner, repo } = context.repo;
            const tag = context.ref.replace("refs/tags/", "");

            const tags = (await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 }))
              .map((t) => t.name)
              .filter((name) => /^v\d+\.\d+\.\d+$/.test(name))
              .sort((a, b) => {
                const [x, y] = [semver(a), semver(b)];
                return y[0] - x[0] || y[1] - x[1] || y[2] - x[2];
              });
            const previous = tags[tags.indexOf(tag) + 1];
            if (!previous) return `Initial release ${tag}.`;

            const { data } = await github.rest.repos.compareCommits({ owner, repo, base: previous, head: tag });
            const entries = SECTIONS.map(() => []);
            for (const commit of data.commits) {
              const subject = commit.commit.message.split("\n")[0];
              const parsed = subject.match(/^(\w+)(?:\([^)]*\))?!?:\s*(.+?)(?:\s+\(#(\d+)\))?$/);
              if (!parsed) continue;
              const [, type, text, pr] = parsed;
              const index = SECTIONS.findIndex((section) => section.types.includes(type));
              if (index === -1) continue;
              entries[index].push(`- ${text[0].toUpperCase()}${text.slice(1)}${pr ? ` (#${pr})` : ""}`);
            }

            const body = SECTIONS
              .map((section, i) => (entries[i].length ? `### ${section.title}\n\n${entries[i].join("\n")}` : null))
              .filter(Boolean)
              .join("\n\n");
            const changelog = `**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previous}...${tag}`;
            return `${body || "Maintenance release — no user-facing changes."}\n\n${changelog}\n`;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.result }}
          generate_release_notes: false
          # nsis.artifactName pins the installer to the space-free
          # "COMET.Setup.<version>.exe" pattern, so the disk name and the
          # GitHub asset name are identical. latest.yml and the .blockmap are
          # what electron-updater reads to detect and delta-download updates.
          files: |
            dist-electron/COMET*.exe
            dist-electron/COMET*.exe.blockmap
            dist-electron/COMET-win-unpacked.zip
            dist-electron/latest.yml
