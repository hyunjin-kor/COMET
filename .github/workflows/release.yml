name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-release:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit root deps (fail on high+ severity)
        run: npm audit --audit-level=high

      - name: Audit frontend deps (fail on high+ severity)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint Python
        run: ruff check .

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build desktop app
        run: |
          npm run build:frontend
          npm run build:backend-sidecar
          npm run desktop:stop
          npx electron-builder build --win --publish never

      - name: Archive unpacked desktop build
        shell: powershell
        run: Compress-Archive -Path dist-electron\win-unpacked\* -DestinationPath dist-electron\CatTEA-win-unpacked.zip

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.result }}
          generate_release_notes: false
          # nsis.artifactName pins the installer to the space-free
          # "CatTEA.Setup.<version>.exe" pattern, so the disk name and the
          # GitHub asset name are identical. latest.yml and the .blockmap are
          # what electron-updater reads to detect and delta-download updates.
          files: |
            dist-electron/CatTEA*.exe
            dist-electron/CatTEA*.exe.blockmap
            dist-electron/CatTEA-win-unpacked.zip
            dist-electron/latest.yml
