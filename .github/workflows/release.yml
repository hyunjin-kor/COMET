name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-release:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop app
        run: |
          npm run build:frontend
          npm run build:backend-sidecar
          npm run desktop:stop
          npx electron-builder build --win --publish never

      - name: Archive unpacked desktop build
        shell: powershell
        run: Compress-Archive -Path dist-electron\win-unpacked\* -DestinationPath dist-electron\CatPrice-win-unpacked.zip

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            return data.body;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.result }}
          generate_release_notes: false
          files: |
            dist-electron/*.exe
            dist-electron/CatPrice-win-unpacked.zip
