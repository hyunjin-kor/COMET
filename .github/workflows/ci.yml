name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # validate_catcost_data.py reads the proprietary CatCost workbook which
      # is gitignored; it runs locally only.

      - name: Test
        run: pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (fail on high+ severity)
        run: npm audit --audit-level=high

      - name: Translation keys and calculator rules
        run: |
          npm run check:i18n
          node ../scripts/test_calculator_rules.mjs
          node ../scripts/test_practical_range.mjs
          node ../scripts/test_scientific_text.mjs
          node --test ../scripts/hosted-session.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          exit $LASTEXITCODE
      - name: Build desktop without publishing
        run: |
          $env:COMET_PYTHON = (Get-Command python).Source
          npm run build:frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:backend-sidecar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder build --win --publish never
          exit $LASTEXITCODE
      - name: Verify packaged app in an isolated profile
        run: npm run smoke:desktop
