version: "3.8"

services:
  app:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./catprice.db}
      - METALS_DEV_API_KEY=${METALS_DEV_API_KEY:-}
      - METALPRICE_API_KEY=${METALPRICE_API_KEY:-}
      - BLS_API_KEY=${BLS_API_KEY:-}
      - DEBUG=${DEBUG:-false}
      - PRICE_UPDATE_HOUR=${PRICE_UPDATE_HOUR:-6}
      # Set this to your production domain to enable CORS for the frontend.
      # Example: CORS_ORIGINS=https://catprice.example.com
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - catprice-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  catprice-data:
